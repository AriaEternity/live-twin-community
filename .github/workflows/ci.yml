name: Public source checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Public file and credential checks
        run: python -B -X utf8 scripts/check_public_release.py
      - name: Python regressions
        run: python -B -X utf8 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Editor and service worker contracts
        run: node --test tests/test_deck_editor_rules.mjs tests/test_sw_contract.mjs
      - name: Isolated business regressions without upstream network
        run: python -B -X utf8 scripts/run_isolated_smoke.py --case smoke_forum_fix.py --case smoke_messages.py --case smoke_social.py --case smoke_decks.py
