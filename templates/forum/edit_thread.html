{% extends "base.html" %}
{% block title %}编辑帖子 — {{ thread.title }}{% endblock %}

{% block content %}
<div class="container">
  <a class="back-link" href="{{ url_for('forum.thread', thread_id=thread.id) }}">‹ 返回帖子</a>
  <div class="page-header">
    <p style="font-size:12px;opacity:.78;margin-bottom:6px;">{{ thread.board.name }}</p>
    <h1>编辑帖子</h1>
  </div>

  {# 表单结构照 new_thread.html；提交到当前 URL；编辑不支持增删附图，已有附件保留 #}
  <form method="post" style="max-width:720px;">
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label for="et-title">标题</label>
      <input class="form-input" type="text" name="title" id="et-title" required minlength="2" maxlength="120" placeholder="给帖子起个响亮标题…" value="{{ title or '' }}">
    </div>
    <div class="form-group">
      <label for="et-content">内容</label>
      <div class="editor-tools">
        <button type="button" class="emote-btn" data-target="et-content" aria-label="插入表情"><span class="emote-btn-icon" aria-hidden="true">😀</span>表情</button>
      </div>
      <textarea class="form-textarea" name="content" id="et-content" required minlength="2" maxlength="10000" placeholder="弹幕装填中，写下正文…">{{ content or '' }}</textarea>
    </div>
    <button class="btn btn-primary" type="submit">保存修改</button>
    <a href="{{ url_for('forum.thread', thread_id=thread.id) }}" class="btn btn-secondary" style="margin-left:10px;">取消</a>
  </form>

  <!-- 表情选择器：结构由 js/emotes.js 驱动（清单 /img/emotes/emotes.json） -->
  <div class="emote-modal" hidden>
    <div class="emote-dialog" role="dialog" aria-modal="true" aria-label="选择表情">
      <div class="emote-head">
        <p class="emote-title">选择表情</p>
        <button class="emote-close" type="button" aria-label="关闭表情面板">×</button>
      </div>
      <div class="emote-tabs" role="tablist"></div>
      <div class="emote-grid"></div>
      <p class="emote-empty" hidden>暂无可用表情</p>
    </div>
  </div>
  <script src="/js/emotes.js"></script>
</div>
{% endblock %}
